[project]
name = "feeds"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "reader>=3.24,<3.25",
    "PySide6>=6.6,<6.12",
    "tenacity>=8.2",
    "requests>=2.31",
    "feedparser>=6.0",
    "rapidfuzz>=3.0",
]

[dependency-groups]
dev = [
    "ruff",
]

[tool.ruff.lint]
extend-select = [
    # flake8-type-checking
    "TC",
    # flake8-tidy-imports
    "TID",
    # pep8-naming
    "N",
    # flake8-builtins
    "A",
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # pydocstyle
    "D",
    # Perflint
    "PERF",
    # tryceratops
    "TRY",
    # flake8-annotations
    "ANN",
    # flake8-async
    "ASYNC",
    # flake8-comprehensions
    "C4",
    # flake8-print
    "T20",
    # flake8-pyi
    "PYI",
    # flake8-return
    "RET",
    # Ruff-specific rules
    "RUF",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.setuptools.packages.find]
include = ["feeds*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


